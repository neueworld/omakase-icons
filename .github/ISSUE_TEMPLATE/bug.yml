name: Report a problem with an icon
description: An icon looks wrong, is blurry, or does not render
title: "Icon problem: "
labels: ["bug"]
body:
  - type: input
    id: icon
    attributes:
      label: Which icon?
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: Include the style, corner, size and where you are using it (React, Vue, Svelte, plain SVG).
    validations:
      required: true
